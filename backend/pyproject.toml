[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "supportpilot-ai"
version = "0.1.0"
description = "Agentic customer operations platform"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [
    {name = "SupportPilot Team"}
]

dependencies = [
    "Django==5.2.17",
    "djangorestframework==3.17.2",
    "django-cors-headers==4.9.0",
    "django-environ==0.14.0",
    "psycopg[binary]==3.3.4",
    "pgvector==0.5.0",
    "celery==5.6.3",
    "redis==8.1.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "langchain==1.3.15",
    "langgraph==1.2.11",
    "openai==3.0.0",
    "python-dateutil==2.9.0.post0",
    "pytz==2026.3.post1",
    "requests==2.34.2",
    # Direct dependency for Phase 10 Block 3's SSRF/DNS-rebinding-safe
    # outbound webhook transport (webhooks/transport.py): connecting to a
    # pre-validated IP while presenting the original hostname for TLS SNI
    # and certificate verification requires urllib3's lower-level
    # HTTPConnectionPool(host=<ip>, server_hostname=<hostname>,
    # assert_hostname=<hostname>) — a capability requests's own HTTPAdapter
    # does not expose without using the same urllib3 API underneath it
    # anyway. Already present as requests's own pinned transitive
    # dependency; declared explicitly here since webhooks/transport.py
    # imports it directly.
    "urllib3==2.7.0",
    "cryptography==50.0.0",
    "pyjwt==2.13.0",
    "stripe==15.5.0",
    "google-auth==2.56.3",
    "google-api-python-client==2.198.0",
    "gunicorn==26.0.0",
    "whitenoise==6.12.0",
    "drf-spectacular==0.30.0",
    "django-filter==25.1",
    "djangorestframework-simplejwt==5.5.1",
    "pypdf==6.15.0",
    # Phase 11: vendor-neutral Prometheus exposition for bounded-cardinality
    # production metrics (observability/metrics.py). A pure client library —
    # no server component, no vendor SDK/agent, no hard external network
    # dependency at request time. Deliberately not OpenTelemetry: Phase 11
    # scopes tracing/correlation to structured logging (see ADR 0009) rather
    # than adding a second, heavier instrumentation stack.
    "prometheus-client==0.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-django==4.14.0",
    "pytest-cov==7.1.0",
    "factory-boy==3.3.3",
    "faker==40.36.0",
    "black==26.5.1",
    "ruff==0.16.3",
    "mypy==2.3.0",
    "django-stubs==6.1.0",
    "djangorestframework-stubs==3.18.0",
    "pytest-asyncio==1.4.0",
    "responses==0.26.2",
    "freezegun==1.5.5",
]

[tool.setuptools]
# "webhooks" was omitted here when the app was added in Phase 10 — a latent
# packaging gap (harmless for this repository's own Docker/dev layout, where
# BASE_DIR is always importable directly off sys.path, but incorrect for any
# consumer that installs this distribution without the source tree present).
# Fixed while touching this file for Phase 11's new dependency.
packages = ["common", "accounts", "workspaces", "customers", "conversations", "tickets", "knowledge", "agents", "tools", "integrations", "policies", "approvals", "notifications", "webhooks", "observability", "evaluations", "audit", "health"]

[tool.black]
line-length = 100
target-version = ["py311"]
exclude = '''
/(
    \.git
  | \.venv
  | \.pytest_cache
  | \.mypy_cache
  | \.ruff_cache
  | \.black-cache-phase4
  | venv
  | migrations
  | __pycache__
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["migrations", "__pycache__", "venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
# Generated migrations are not hand-maintained and re-run through
# makemigrations on every schema change; type-checking them adds no value.
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["celery.*", "environ.*", "google_auth_httplib2.*", "httplib2.*", "googleapiclient.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
pythonpath = ["."]
testpaths = [".", ]
addopts = "--strict-markers -v --tb=short"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
    "security: Security tests",
    "permission: Permission tests",
]

[tool.coverage.run]
source = [".", ]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/__pycache__/*",
    "*/venv/*",
    "manage.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
]
fail_under = 95
precision = 2
