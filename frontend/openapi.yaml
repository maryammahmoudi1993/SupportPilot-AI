  /api/v1/workspaces/{workspace_id}/agent-runs/:
    get:
      operationId: api_v1_workspaces_agent_runs_list
      description: |-
        Resolves ``self.workspace`` and ``self.membership`` (the caller's own
        active membership) from the ``workspace_id`` URL kwarg *inside*
        ``check_permissions`` — after authentication has run, but before any
        workspace-specific permission class runs. Anonymous callers get 401.
        Callers who are not an active member of the workspace get 404, exactly
        as if the workspace did not exist, so cross-tenant lookups never confirm
        existence.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAgentRunList'
          description: ''
    post:
      operationId: api_v1_workspaces_agent_runs_create
      description: |-
        Resolves ``self.workspace`` and ``self.membership`` (the caller's own
        active membership) from the ``workspace_id`` URL kwarg *inside*
        ``check_permissions`` — after authentication has run, but before any
        workspace-specific permission class runs. Anonymous callers get 401.
        Callers who are not an active member of the workspace get 404, exactly
        as if the workspace did not exist, so cross-tenant lookups never confirm
        existence.
      parameters:
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentRunCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AgentRunCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AgentRunCreate'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRun'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                RateLimited:
                  value:
                    error:
                      code: rate_limited
                      message: Request was throttled.
                      details:
                        retry_after: 30
                  summary: Rate limited
          description: Too many run requests.
