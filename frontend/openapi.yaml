              $ref: '#/components/schemas/PatchedWebhookEndpointUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedWebhookEndpointUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedWebhookEndpointUpdate'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEndpoint'
          description: ''
  /api/v1/workspaces/{workspace_id}/webhooks/endpoints/{endpoint_id}/rotate-secret/:
    post:
      operationId: api_v1_workspaces_webhooks_endpoints_rotate_secret_create
      description: |-
        Resolves ``self.workspace`` and ``self.membership`` (the caller's own
        active membership) from the ``workspace_id`` URL kwarg *inside*
        ``check_permissions`` — after authentication has run, but before any
        workspace-specific permission class runs. Anonymous callers get 401.
        Callers who are not an active member of the workspace get 404, exactly
        as if the workspace did not exist, so cross-tenant lookups never confirm
        existence.
      parameters:
      - in: path
        name: endpoint_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookRotateSecretResponse'
          description: ''
  /api/v1/workspaces/{workspace_id}/webhooks/endpoints/{endpoint_id}/status/:
    patch:
      operationId: api_v1_workspaces_webhooks_endpoints_status_partial_update
      description: |-
        Resolves ``self.workspace`` and ``self.membership`` (the caller's own
        active membership) from the ``workspace_id`` URL kwarg *inside*
        ``check_permissions`` — after authentication has run, but before any
        workspace-specific permission class runs. Anonymous callers get 401.
        Callers who are not an active member of the workspace get 404, exactly
        as if the workspace did not exist, so cross-tenant lookups never confirm
        existence.
      parameters:
      - in: path
        name: endpoint_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedWebhookEndpointStatus'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedWebhookEndpointStatus'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedWebhookEndpointStatus'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEndpoint'
          description: ''
  /health/:
    get:
      operationId: health_retrieve
      description: 'Liveness endpoint: process is up. Does not touch any dependency.'
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
          description: ''
  /ready/:
    get:
      operationId: ready_retrieve
      description: |-
        Readiness endpoint: process can serve traffic (DB and cache reachable).

        Only dependencies the web process itself requires for normal request
        handling are checked here — PostgreSQL and the shared Django cache
        (Redis). A Celery worker being unavailable does not make the web
        process unready, so it is deliberately not checked; neither are any
        external SaaS providers (Section 27).
      tags:
      - ready
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
          description: ''
