openapi: 3.0.3
info:
  title: ''
  version: 0.0.0
paths:
  /api/v1/auth/csrf/:
    get:
      operationId: api_v1_auth_csrf_retrieve
      description: |-
        Prime the CSRF cookie for the browser flow. Call before login/refresh/
        logout so the required CSRF header can be sent on the follow-up request.
      tags:
      - api
      security:
      - {}
      responses:
        '200':
          description: CSRF cookie set.
  /api/v1/auth/login/:
    post:
      operationId: api_v1_auth_login_create
      description: |-
        Verify email/password and start a session: JSON access token + a
        fresh HttpOnly refresh cookie. Never returns the refresh token in JSON.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              LoginRequest:
                value:
                  email: jane@example.com
                  password: correct-horse-battery-staple
                summary: Login request
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginSuccess'
              examples:
                LoginSuccess:
                  value:
                    access: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example-access-token
                    user:
                      id: 42
                      email: jane@example.com
                      display_name: Jane Doe
                      workspaces:
                      - id: 5c4d0c9e-6c0a-4b0a-9f0e-1234567890ab
                        name: Acme Support
                        slug: acme-support
                        role: support_agent
                  summary: Login success
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                AuthenticationFailed:
                  value:
                    error:
                      code: authentication_failed
                      message: Invalid credentials.
                  summary: Authentication failed
          description: Invalid credentials.
  /api/v1/auth/logout/:
    post:
      operationId: api_v1_auth_logout_create
      description: |-
        Revoke the current refresh token and clear its cookie. Idempotent from
        the browser's perspective: a missing or already-invalid token is a safe
        no-op, not an error.
      tags:
      - api
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: Logged out.
  /api/v1/auth/me/:
    get:
      operationId: api_v1_auth_me_retrieve
      description: Current authenticated user plus a safe workspace-membership summary.
      tags:
      - api
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/v1/auth/refresh/:
    post:
      operationId: api_v1_auth_refresh_create
      description: |-
        Rotate the refresh token (read from the HttpOnly cookie) and return a
        fresh access token. The previously-used refresh token is blacklisted.
      tags:
      - api
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: New access token issued.
  /api/v1/channels/public/inbound/{endpoint_id}/:
    post:
      operationId: api_v1_channels_public_inbound_create
      description: |-
        Public: a signed provider webhook (generic or email-style, section
        19). Authenticated entirely by the endpoint's signing secret — never
        staff JWT/RBAC (section 45).
      parameters:
      - in: path
        name: endpoint_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - {}
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboundWebhookAccepted'
              examples:
                Accepted:
                  value:
                    accepted: true
                    event_id: 9c1e2d3a-4b5c-4d6e-8f7a-1b2c3d4e5f6a
                  summary: 'Accepted — both a first delivery and an authenticated,
                    byte-identical redelivery of the same provider event return 202
                    with the same event_id (Section 53: duplicate delivery is an idempotent
                    accept, not a failure).'
          description: ''
  /api/v1/channels/public/webchat/{endpoint_id}/session/:
    post:
      operationId: api_v1_channels_public_webchat_session_create
      description: |-
        Public: creates a new anonymous web-chat session. ``endpoint_id`` is
        the endpoint's public routing identifier — it selects *which* widget
        configuration applies, never an authorization grant onto arbitrary
        workspace data (section 15, 17).
      parameters:
      - in: path
        name: endpoint_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSessionBootstrapResponse'
          description: ''
  /api/v1/channels/public/webchat/session/{session_token}/messages/:
    get:
      operationId: api_v1_channels_public_webchat_session_messages_list
      description: |-
        Public, session-scoped: submit a customer message or retrieve the
        conversation's messages so far. Authenticated by the opaque session
        token in the URL — never a staff JWT (section 45, 58).
      parameters:
      - in: path
        name: session_token
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChatMessage'
          description: ''
    post:
      operationId: api_v1_channels_public_webchat_session_messages_create
      description: |-
        Public, session-scoped: submit a customer message or retrieve the
        conversation's messages so far. Authenticated by the opaque session
        token in the URL — never a staff JWT (section 45, 58).
      parameters:
      - in: path
        name: session_token
        schema:
          type: string
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatMessageSubmit'
            examples:
              SubmitMessage:
                value:
                  client_message_id: web-client-0f3a9c
                  body: My order hasn't arrived.
                summary: Submit message
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChatMessageSubmit'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChatMessageSubmit'
        required: true
      security:
      - {}
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessageSubmitResponse'
              examples:
                Accepted:
                  value:
                    accepted: true
                    message_id: 6f9e2d3a-6b1a-4e9a-9c3a-7b1e2d3a4f5c
                  summary: Accepted (first submission or an idempotent replay of the
                    same client_message_id — both return 202 with the same message_id)
          description: ''
  /api/v1/schema/:
    get:
      operationId: api_v1_schema_retrieve
      description: |-
        OpenApi3 schema for this API. Format can be selected via content negotiation.

